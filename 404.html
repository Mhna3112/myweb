<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Không tìm thấy trang | Duc Manh</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000;
      --card-bg: #09090b;
      --border: #27272a;
      --fg: #ededed;
      --fg2: #a1a1aa;
      --accent: #9281f7;
      --accent-glow: rgba(146, 129, 247, 0.18);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    [data-theme="light"] {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --border: #e4e4e7;
      --fg: #111113;
      --fg2: #71717a;
      --accent: #7c68ee;
      --accent-glow: rgba(124, 104, 238, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background-image: radial-gradient(circle at 50% 35%, var(--accent-glow) 0%, transparent 65%);
    }
    .card-404 {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px var(--accent-glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .code-404 {
      font-family: var(--mono);
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -2px;
    }
    .title-404 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--fg);
    }
    .desc-404 {
      font-size: 0.92rem;
      color: var(--fg2);
      line-height: 1.6;
    }
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--fg);
      color: var(--bg);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 12px 24px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s ease;
      margin-top: 10px;
    }
    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(146, 129, 247, 0.35);
    }
    .footer-brand {
      margin-top: 28px;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--fg2);
    }
  </style>
</head>
<body>
  <div class="card-404">
    <div class="avatar-wrapper">
      <img src="/avatar.jpg" alt="Duc Manh Cat Avatar" class="avatar-img" />
    </div>
    <div class="code-404">404</div>
    <h1 class="title-404">Trang không tồn tại / Page Not Found</h1>
    <p class="desc-404">
      Đường dẫn bạn truy cập có thể đã đổi hoặc không còn tồn tại.<br />
      The page you are looking for doesn't exist or has been moved.
    </p>
    <a href="/" class="home-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Về trang chủ</span>
    </a>
  </div>
  <div class="footer-brand">&lt;DucManh/&gt; • ducmanh.xyz</div>
  <script>
    // Sync theme with localStorage
    try {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (e) {}
  </script>
</body>
</html>
