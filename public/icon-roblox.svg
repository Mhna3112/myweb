<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="rb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#300922"/>
      <stop offset="50%" stop-color="#1c0514"/>
      <stop offset="100%" stop-color="#0b0107"/>
    </linearGradient>
    <linearGradient id="rb-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="rb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#rb-bg)" stroke="#f43f5e" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- MhnaaUI HUD Frame Corners -->
  <path d="M26 36h-8v-8M94 28h8v8M102 84v8h-8M26 100h-8v-8" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Iconic Tilted Roblox Cube with Hollow Center -->
  <g filter="url(#rb-glow)">
    <g transform="translate(60, 60) rotate(-14)">
      <!-- Outer Tilted Square -->
      <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#e11d48" stroke="#fda4af" stroke-width="2.5"/>
      <!-- Inner Hollow Center -->
      <rect x="-8" y="-8" width="16" height="16" rx="3" fill="#1c0514" stroke="#f43f5e" stroke-width="1.5"/>
    </g>
  </g>

  <!-- UI Code Brackets "<" and ">" -->
  <path d="M25 54l-8 6 8 6" stroke="url(#rb-rose)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M95 54l8 6-8 6" stroke="url(#rb-rose)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Luau Scripting Dot Indicator -->
  <circle cx="60" cy="94" r="3.5" fill="#fb7185"/>
  <circle cx="60" cy="94" r="8" stroke="#fb7185" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Corner Dots -->
  <circle cx="20" cy="20" r="2.5" fill="#f43f5e"/>
  <circle cx="100" cy="20" r="2.5" fill="#f43f5e" fill-opacity="0.5"/>
  <circle cx="20" cy="100" r="2.5" fill="#f43f5e" fill-opacity="0.5"/>
  <circle cx="100" cy="100" r="2.5" fill="#f43f5e"/>
</svg>
