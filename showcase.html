<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ThreeUI Bestsellers Book Showcase — Field Manuals: Tools for Thought (Codex, Claude Code, Cursor) in 3D WebGL." />
  <title>3D Book Showcase — Field Manuals | Duc Manh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #050505;
      --bar-bg: rgba(18, 18, 20, 0.82);
      --border: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(255, 255, 255, 0.25);
      --fg: #ffffff;
      --fg-muted: #9ba1a6;
      --accent: #c3a47b;
      --accent-bright: #dbc39c;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    /* Top Floating Bar */
    .top-bar {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: calc(100% - 32px);
      max-width: 1120px;
      padding: 10px 18px;
      background: var(--bar-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--fg);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--border-hover);
      transform: translateX(-2px);
    }

    .page-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--fg-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    .title-highlight {
      color: var(--fg);
      font-weight: 600;
    }

    .actions-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--fg);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-hover);
    }

    .action-btn-accent {
      background: var(--accent);
      color: #1a1712;
      border-color: var(--accent);
      font-weight: 600;
    }

    .action-btn-accent:hover {
      background: var(--accent-bright);
      color: #1a1712;
      border-color: var(--accent-bright);
    }

    /* Main Showcase Frame */
    .showcase-viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #29251d;
    }

    .showcase-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #29251d;
    }

    /* Bottom Info Banner */
    .bottom-hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      padding: 6px 14px;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.65);
      background: rgba(18, 18, 20, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    @media (max-width: 768px) {
      .top-bar {
        top: 10px;
        width: calc(100% - 20px);
        padding: 8px 12px;
      }
      .page-title {
        display: none;
      }
      .bottom-hint {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Top Floating Header -->
  <header class="top-bar" id="topBar">
    <div class="brand-group">
      <a href="./" class="back-btn" title="Trở về trang chủ Portfolio">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        <span>Trang chủ</span>
      </a>
      <div class="page-title">
        <span class="status-dot"></span>
        <span>ThreeUI • <span class="title-highlight">Field Manuals Book Showcase</span></span>
      </div>
    </div>

    <div class="actions-group">
      <button class="action-btn" id="fsBtn" title="Toàn màn hình (F11 hoặc click)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="fsIconOpen"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="fsIconExit" style="display:none;"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        <span id="fsText">Toàn màn hình</span>
      </button>
      <a href="landing-pages/bestsellers-book-showcase.html" target="_blank" rel="noopener" class="action-btn action-btn-accent" title="Mở trang nguyên bản ThreeUI">
        <span>Bản Gốc ↗</span>
      </a>
    </div>
  </header>

  <!-- Showcase Viewport -->
  <main class="showcase-viewport">
    <iframe
      id="showcaseFrame"
      class="showcase-iframe"
      src="landing-pages/bestsellers-book-showcase.html"
      title="Field Manuals — Tools for Thought"
      allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen
    ></iframe>
  </main>

  <!-- Hint -->
  <div class="bottom-hint" id="bottomHint">
    Kéo chuột để xoay sách 3D • Nhấp vào sách để mở cẩm nang đọc
  </div>

  <script>
    // Fullscreen Toggle
    const fsBtn = document.getElementById('fsBtn');
    const fsText = document.getElementById('fsText');
    const fsIconOpen = document.getElementById('fsIconOpen');
    const fsIconExit = document.getElementById('fsIconExit');
    const topBar = document.getElementById('topBar');
    const bottomHint = document.getElementById('bottomHint');

    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    });

    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      if (isFs) {
        fsIconOpen.style.display = 'none';
        fsIconExit.style.display = 'inline-block';
        fsText.textContent = 'Thu nhỏ';
      } else {
        fsIconOpen.style.display = 'inline-block';
        fsIconExit.style.display = 'none';
        fsText.textContent = 'Toàn màn hình';
      }
    });
  </script>
</body>
</html>
